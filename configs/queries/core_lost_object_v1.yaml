  - query_id: object_memory_last_contact
    group: object_memory
    task: nlq
    mode: hard_pseudo_nlq
    query: "object_last_seen=door which=last top_k=6"
    signal_tags: [object_memory]
    sensitive_to: [object_memory]
  - query_id: lost_object_summary_first
    group: object_memory
    task: repo
    mode: summary_first
    query: "lost_object=door repo_mode=summary_first summary_topk=3 top_k=6"
    signal_tags: [lost_object, repo_summary]
    sensitive_to: [object_memory, repo_summary]
